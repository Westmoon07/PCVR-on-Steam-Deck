
site_name: My Advanced Wiki
site_description: A full-featured MkDocs + Material documentation site
theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  palette:
    - scheme: default
      primary: blue
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
    - header.autohide

nav:
  - Home: index.md
  - Guide:
      - Overview: guide/overview.md
      - Installation: guide/installation.md
      - Configuration: guide/configuration.md
  - Tutorials:
      - Writing Docs: tutorials/writing-docs.md
      - Styling: tutorials/styling.md
  - About: about.md

extra:
  social:
    - icon: material/github
      link: https://github.com
    - icon: material/web
      link: https://example.com
      
extra_css:
  - assets/extra.css
  
plugins:
  - search
  - tags
