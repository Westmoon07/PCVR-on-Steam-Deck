site_name: PCVR on Steam Deck
site_url: https://pcvr-on-steam-deck.vercel.app/
theme:
  name: material
  features:
    - navigation.instant
    - navigation.expand       # Sidebar always expanded
    - navigation.sections     # Sidebar section styling
    - navigation.tracking
    - toc.follow
    - content.code.copy
  palette:
    - scheme: default
      primary: deep purple        # Whisky-style sidebar
      accent: deep purple
      background: white
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: deep purple
      background: black

extra_css:
  - styles/whisky.css


nav:
  - Home: index.md
  - Guide:
      - Overview: guide/overview.md
      - Installation: guide/installation.md
      - Configuration: guide/configuration.md
  - Tutorials:
      - Writing Docs: tutorials/writing-docs.md
      - Styling: tutorials/styling.md
  - About: about.md

extra:
  social:
    - icon: material/github
      link: https://github.com/Westmoon07/PCVR-on-Steam-Deck
    - icon: material/web
      link: https://www.westmoon05.xyz/
      
extra_css:
  - assets/extra.css
  
plugins:
  - search
  - tags
